<title>העברת פנייה למחלקת ויזות | AMSVISA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#1bb0ce;
  --teal-dark:#128fa9;
  --teal-deep:#0d7189;
  --teal-soft:#eaf7fb;
  --teal-line:#c4e8f2;
  --ink:#16262e;
  --ink-soft:#3d525d;
  --muted:#7a8d97;
  --line:#e3ecf0;
  --field:#f7fafc;
  --danger:#c8372a;
  --danger-soft:#fdf3f1;
  --ok:#159d69;
  --warn:#d9722c;
  --r:14px;
  --shadow:0 1px 2px rgba(16,44,55,.05),
           0 10px 24px -10px rgba(16,44,55,.14),
           0 44px 70px -40px rgba(16,44,55,.32);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Heebo',system-ui,sans-serif;
  color:var(--ink);
  min-height:100vh;padding:36px 18px 48px;
  display:flex;justify-content:center;align-items:flex-start;
  background:
    radial-gradient(1100px 520px at 78% -8%, rgba(27,176,206,.16), transparent 62%),
    radial-gradient(820px 460px at 8% 104%, rgba(27,176,206,.10), transparent 60%),
    linear-gradient(168deg,#f4f9fb 0%,#eaf1f4 52%,#f3f8fa 100%);
  background-attachment:fixed;
}

/* ── כרטיסייה ─────────────────────────────── */
.card{
  background:#fff;width:100%;max-width:660px;
  border-radius:var(--r);overflow:hidden;
  box-shadow:var(--shadow);
  animation:riseIn .62s cubic-bezier(.16,.84,.34,1) both;
}
@keyframes riseIn{
  from{opacity:0;transform:translateY(26px) scale(.985)}
  to  {opacity:1;transform:none}
}
.accent{height:4px;background:linear-gradient(90deg,var(--teal-deep),var(--teal) 55%,#63d3e8)}

.head{
  padding:32px 36px 24px;text-align:center;
  background:linear-gradient(180deg,#fbfeff,#fff);
  border-bottom:1px solid var(--line);
}
.head img{width:100%;max-width:250px;height:auto;display:block;margin:0 auto 20px}
h1{font-size:23px;font-weight:900;margin:0 0 8px;letter-spacing:-.4px}
.head p{margin:0 auto;max-width:430px;color:var(--muted);
        font-size:14.5px;font-weight:400;line-height:1.6}

form{padding:28px 36px 34px}

/* ── קטעים ─────────────────────────────────── */
fieldset{border:0;padding:0;margin:0 0 26px;
  animation:riseIn .5s cubic-bezier(.16,.84,.34,1) both}
fieldset:nth-of-type(1){animation-delay:.10s}
fieldset:nth-of-type(2){animation-delay:.17s}
fieldset:nth-of-type(3){animation-delay:.24s}
.noanim fieldset{animation:none}
legend{
  font-size:11.5px;font-weight:900;color:var(--teal-dark);
  letter-spacing:1.1px;margin-bottom:16px;padding:0;
  display:flex;align-items:center;gap:11px;width:100%;
}
legend::before{content:"";width:6px;height:6px;border-radius:50%;
  background:var(--teal);flex:0 0 auto}
legend::after{content:"";flex:1;height:1px;
  background:linear-gradient(to left,var(--line),transparent)}

/* ── שדות ─────────────────────────────────── */
.row{display:flex;flex-wrap:wrap;gap:18px}
.fld{flex:1 1 210px;margin-bottom:18px;min-width:0}
.row .fld{margin-bottom:0}
.row+.fld,.row+.row{margin-top:18px}
label{display:block;margin-bottom:8px;font-size:13.5px;
      font-weight:700;color:var(--ink-soft)}
label .req{color:var(--danger);font-weight:700;margin-inline-start:2px}
label .opt{font-weight:400;color:var(--muted);font-size:12px}

input,select,textarea{
  width:100%;padding:13px 14px;
  border:1.5px solid transparent;background:var(--field);
  box-shadow:inset 0 0 0 1px var(--line);
  border-radius:10px;font-family:inherit;font-size:15px;font-weight:500;
  color:var(--ink);
  transition:background .2s ease,box-shadow .2s ease,border-color .2s ease;
}
input::placeholder,textarea::placeholder{color:#a9b9c1;font-weight:400}
textarea{resize:vertical;min-height:84px;line-height:1.6}
input:hover,textarea:hover{box-shadow:inset 0 0 0 1px #cfdde4}
input:focus,select:focus,textarea:focus{
  outline:none;background:#fff;border-color:var(--teal);
  box-shadow:0 0 0 4px rgba(27,176,206,.15);
}
input.err{
  background:var(--danger-soft);border-color:var(--danger);
  box-shadow:0 0 0 4px rgba(200,55,42,.10);
}
input[dir=ltr]{text-align:left}
input[type=date]{color:var(--ink)}

/* ── בחירת יעד עם דגלים ─────────────────────── */
.combo{position:relative}
.combo input{padding-inline-start:44px}
.cflag{
  position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);
  width:22px;height:16px;border-radius:2.5px;z-index:2;pointer-events:none;
  background-size:cover;background-position:center;
  box-shadow:0 0 0 1px rgba(22,38,46,.14);
  opacity:0;transition:opacity .18s ease;
}
.cflag.on{opacity:1}
.cflag.globe{
  opacity:1;background:none;box-shadow:none;
  width:18px;height:18px;color:var(--muted);
}
.clist{
  display:none;position:absolute;z-index:30;inset-inline:0;top:calc(100% + 6px);
  margin:0;padding:6px;list-style:none;max-height:262px;overflow-y:auto;
  background:#fff;border:1px solid var(--line);border-radius:12px;
  box-shadow:0 2px 6px rgba(16,44,55,.06),0 18px 34px -12px rgba(16,44,55,.26);
  animation:listIn .18s cubic-bezier(.16,.84,.34,1) both;
}
@keyframes listIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.clist.open{display:block}
.clist li{
  display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;
  font-size:14.5px;font-weight:600;color:var(--ink);cursor:pointer;
  transition:background .13s ease;
}
.clist li img{width:24px;height:18px;border-radius:2.5px;flex:0 0 auto;
  box-shadow:0 0 0 1px rgba(22,38,46,.14)}
.clist li svg{width:19px;height:19px;color:var(--muted);flex:0 0 auto;margin:0 2px}
.clist li:hover,.clist li.on{background:var(--teal-soft)}
.clist li.on{color:var(--teal-deep)}
.clist .none{color:var(--muted);font-weight:500;cursor:default;justify-content:center}
.clist .none:hover{background:none}
.clist::-webkit-scrollbar{width:9px}
.clist::-webkit-scrollbar-thumb{background:#d5e2e8;border-radius:9px;border:3px solid #fff}

.hint{margin-top:7px;font-size:12.5px;font-weight:600;min-height:16px;
      display:flex;align-items:center;gap:5px}
.hint.warn{color:var(--warn)}
.hint.ok{color:var(--muted)}
.hint.bad{color:var(--danger)}

/* ── העלאת קבצים ───────────────────────────── */
.drop{
  position:relative;border:1.5px dashed var(--teal-line);border-radius:12px;
  padding:26px 16px;text-align:center;background:linear-gradient(180deg,#fbfdfe,#f6fbfd);
  cursor:pointer;transition:border-color .2s,background .2s,transform .18s;
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.drop input[type=file]{
  position:absolute;inset:0;width:100%;height:100%;
  opacity:0;cursor:pointer;padding:0;border:0;box-shadow:none;
}
.drop:hover,.drop.over{border-color:var(--teal);background:var(--teal-soft)}
.drop.over{transform:scale(1.008)}
.drop svg{width:30px;height:30px;color:var(--teal);margin-bottom:2px;
  transition:transform .22s cubic-bezier(.16,.84,.34,1)}
.drop:hover svg,.drop.over svg{transform:translateY(-3px)}
.drop-txt{font-size:14.5px;font-weight:800;color:var(--teal-dark)}
.drop-sub{font-size:12.5px;font-weight:400;color:var(--muted)}

.hp{
  position:absolute!important;left:-9999px!important;top:auto!important;
  width:1px!important;height:1px!important;overflow:hidden!important;
}
.drop.busy{pointer-events:none;opacity:.72}
.drop.busy input[type=file]{pointer-events:none}
.spin{
  width:26px;height:26px;border-radius:50%;
  border:2.5px solid var(--teal-line);border-top-color:var(--teal);
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.files:not(:empty){margin-top:12px;display:flex;flex-direction:column;gap:8px}
.file{
  display:flex;align-items:center;gap:11px;background:var(--teal-soft);
  border:1px solid var(--teal-line);border-radius:10px;
  padding:10px 13px;font-size:13.5px;font-weight:600;
  animation:fileIn .3s cubic-bezier(.16,.84,.34,1) both;
}
@keyframes fileIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.file svg{width:17px;height:17px;color:var(--teal-dark);flex:0 0 auto}
.file .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .sz{color:var(--muted);font-size:12px;font-weight:600;direction:ltr}
.file .rm{
  border:0;background:none;color:var(--muted);cursor:pointer;
  font-size:20px;line-height:1;padding:0 3px;font-family:inherit;
  border-radius:5px;transition:color .18s,background .18s;
}
.file .rm:hover{color:var(--danger);background:rgba(200,55,42,.09)}

/* ── שגיאות ────────────────────────────────── */
.formerr{
  display:none;background:var(--danger-soft);
  border:1px solid #f2ccc5;border-right:4px solid var(--danger);
  color:var(--danger);border-radius:10px;padding:14px 16px;
  font-size:14px;font-weight:600;margin-bottom:22px;line-height:1.55;
}
.formerr.show{display:block;animation:errIn .34s cubic-bezier(.16,.84,.34,1) both}
@keyframes errIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.errline{display:flex;align-items:flex-start;gap:9px}
.errline svg{width:18px;height:18px;flex:0 0 auto;margin-top:1px}
.mailfb{
  display:none;margin-top:13px;background:var(--teal);color:#fff;
  border:0;border-radius:8px;padding:10px 18px;font-family:inherit;
  font-size:14px;font-weight:800;cursor:pointer;transition:background .18s;
}
.mailfb.show{display:block}
.mailfb:hover{background:var(--teal-dark)}

/* ── כפתור שליחה ───────────────────────────── */
.btn{
  width:100%;padding:16px;border:0;border-radius:11px;
  background:linear-gradient(135deg,var(--teal) 0%,var(--teal-dark) 62%,var(--teal-deep) 100%);
  color:#fff;font-family:inherit;font-size:16.5px;font-weight:900;
  cursor:pointer;margin-top:10px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 5px 16px -4px rgba(18,143,169,.45);
  transition:box-shadow .22s ease,transform .12s ease,filter .22s ease;
}
.btn svg{width:19px;height:19px;transform:scaleX(-1)}
.btn:hover:not(:disabled){
  box-shadow:0 10px 26px -6px rgba(18,143,169,.55);
  transform:translateY(-1px);filter:saturate(1.08);
}
.btn:active:not(:disabled){transform:translateY(0) scale(.988);
  box-shadow:0 3px 10px -3px rgba(18,143,169,.45)}
.btn:disabled{background:#b3c1c8;box-shadow:none;cursor:default}

/* ── מסך הצלחה ─────────────────────────────── */
.done{display:none;padding:56px 36px 60px;text-align:center}
.done.show{display:block;animation:riseIn .5s cubic-bezier(.16,.84,.34,1) both}
.done .mark{
  width:76px;height:76px;border-radius:50%;
  background:linear-gradient(140deg,var(--teal-soft),#dff3f9);
  border:1px solid var(--teal-line);color:var(--ok);
  display:flex;align-items:center;justify-content:center;margin:0 auto 22px;
}
.done .mark svg{width:36px;height:36px}
.done .mark svg path{
  stroke-dasharray:32;stroke-dashoffset:32;
  animation:draw .5s .22s cubic-bezier(.6,.1,.3,1) forwards;
}
@keyframes draw{to{stroke-dashoffset:0}}
.done h2{margin:0 0 10px;font-size:23px;font-weight:900;letter-spacing:-.3px}
.done p{margin:0 auto 8px;color:var(--muted);font-size:15px;
        max-width:390px;line-height:1.65}
.ref{
  display:inline-block;margin-top:16px;background:var(--teal-soft);
  border:1px solid var(--teal-line);color:var(--teal-dark);
  border-radius:9px;padding:9px 18px;font-size:14px;
  font-weight:900;letter-spacing:.5px;
}
.again{
  margin-top:28px;background:none;border:1.5px solid var(--line);
  border-radius:10px;padding:12px 28px;font-family:inherit;
  font-size:14.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;
  transition:border-color .2s,color .2s,background .2s;
}
.again:hover{border-color:var(--teal);color:var(--teal-dark);background:var(--teal-soft)}

:focus-visible{outline:3px solid rgba(27,176,206,.45);outline-offset:2px}

@media (max-width:560px){
  body{padding:0;background-attachment:scroll}
  .card{border-radius:0;min-height:100vh;box-shadow:none;animation:none}
  .head{padding:26px 20px 20px}
  .head img{max-width:210px}
  h1{font-size:20px}
  form{padding:24px 20px 32px}
  .done{padding:46px 22px 52px}
  .fld{flex:1 1 100%}
  fieldset{animation:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .done .mark svg path{stroke-dashoffset:0}
}
</style>

const ENDPOINT    = 'https://script.google.com/macros/s/AKfycbx3mXkSBkhZuSThBU_XjONG3dA39khUyHE4B6U2up_lGBQ33hcTCHDiAScDFdp4gf35/exec';

const REMEMBER = 'amsvisa_referrer';
function rememberGet(){ try{ return localStorage.getItem(REMEMBER) || ''; }catch(_){ return ''; } }
function rememberSet(v){ try{ localStorage.setItem(REMEMBER, v); }catch(_){} }
const form = $('leadForm'), errBox = $('formErr'), btn = $('submitBtn'),
      btnTxt = $('btnTxt');

(function restoreReferrer(){
  const saved = rememberGet();
  if(saved){ $('agent_name').value = saved; }
})();

/* תאריך יציאה: לא בעבר, וחיווי חי על דחיפות */
const dep = $('departure'), depHint = $('depHint');
const today = new Date(); today.setHours(0,0,0,0);
dep.min = today.toISOString().slice(0,10);

function daysToDeparture(){
  if(!dep.value) return null;
  const d = new Date(dep.value + 'T00:00:00');
  return Math.round((d - today) / 86400000);
}
dep.addEventListener('change', () => {
  const n = daysToDeparture();
  depHint.className = 'hint';
  if(n === null){ depHint.textContent = ''; return; }
  if(n < 0){ depHint.textContent = 'התאריך כבר עבר'; depHint.classList.add('bad'); }
  else if(n === 0){ depHint.textContent = 'יציאה היום — דחוף'; depHint.classList.add('warn'); }
  else if(n <= URGENT_DAYS){ depHint.textContent = 'יציאה בעוד ' + n + ' ימים — מסומן כדחוף'; depHint.classList.add('warn'); }
  else { depHint.textContent = 'יציאה בעוד ' + n + ' ימים'; depHint.classList.add('ok'); }
});

/* טלפון: מקבל מקפים ורווחים, מנרמל ל-05XXXXXXXX */
const phone = $('client_phone'), phoneHint = $('phoneHint');
const cleanPhone = v => v.replace(/[\s\-().]/g,'').replace(/^\+972/,'0');
const validPhone = v => /^0(5\d|[2-4,8-9]|7\d)\d{7}$/.test(cleanPhone(v));
phone.addEventListener('blur', () => {
  if(!phone.value.trim()){ phoneHint.textContent=''; return; }
  const ok = validPhone(phone.value);
  phoneHint.className = 'hint ' + (ok ? 'ok' : 'bad');
  phoneHint.textContent = ok ? '' : 'מספר לא תקין — 10 ספרות המתחילות ב-0';
  phone.classList.toggle('err', !ok);
});

const DESTS = Object.keys(FLAGS).concat(['אחר / לא בטוח']);
const GLOBE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"'
            + ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
            + '<circle cx="12" cy="12" r="9"></circle>'
            + '<path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18"></path></svg>';

const dest = $('destination'), destList = $('destList'), destFlag = $('destFlag');
let cIdx = -1, cShown = [];

/* משווה בלי גרשיים ורווחים: "ארהב" ימצא את "ארה״ב" */
const norm = s => s.replace(/["'\u05f3\u05f4\u2019\s]/g,'');

function setFlag(name){
  destFlag.className = 'cflag';
  destFlag.innerHTML = '';
  destFlag.style.backgroundImage = '';
  if(FLAGS[name]){
    destFlag.style.backgroundImage = 'url(data:image/png;base64,' + FLAGS[name] + ')';
    destFlag.classList.add('on');
  }else if(name === 'אחר / לא בטוח'){
    destFlag.innerHTML = GLOBE;
    destFlag.classList.add('globe');
  }
}

function openList(filter){
  const q = norm(filter || '');
  cShown = DESTS.filter(n => !q || norm(n).indexOf(q) > -1);
  destList.innerHTML = '';
  if(!cShown.length){
    const li = document.createElement('li');
    li.className = 'none';
    li.textContent = 'לא נמצא יעד — ניתן להקליד חופשי';
    destList.appendChild(li);
  }
  cShown.forEach((n,i) => {
    const li = document.createElement('li');
    li.id = 'dest-' + i;
    li.setAttribute('role','option');
    li.innerHTML = FLAGS[n]
      ? '<img src="data:image/png;base64,' + FLAGS[n] + '" alt="">'
      : GLOBE;
    li.appendChild(document.createTextNode(n));
    li.addEventListener('mousedown', e => { e.preventDefault(); pick(n); });
    destList.appendChild(li);
  });
  destList.classList.add('open');
  dest.setAttribute('aria-expanded','true');
  cIdx = -1;
}

function closeList(){
  destList.classList.remove('open');
  dest.setAttribute('aria-expanded','false');
  dest.removeAttribute('aria-activedescendant');
  cIdx = -1;
}

function pick(n){
  dest.value = n;
  setFlag(n);
  dest.classList.remove('err');
  closeList();
}

function highlight(i){
  const items = destList.querySelectorAll('li[role=option]');
  if(!items.length) return;
  cIdx = (i + items.length) % items.length;
  items.forEach(el => el.classList.remove('on'));
  const el = items[cIdx];
  el.classList.add('on');
  el.scrollIntoView({block:'nearest'});
  dest.setAttribute('aria-activedescendant', el.id);
}

dest.addEventListener('focus', () => openList(dest.value));
dest.addEventListener('input', () => { setFlag(dest.value); openList(dest.value); });
document.addEventListener('pointerdown', e => {
  if(!$('destCombo').contains(e.target)) closeList();
});
dest.addEventListener('keydown', e => {
  const open = destList.classList.contains('open');
  if(e.key === 'ArrowDown'){ e.preventDefault(); open ? highlight(cIdx+1) : openList(dest.value); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); if(open) highlight(cIdx-1); }
  else if(e.key === 'Enter' && open && cIdx > -1){ e.preventDefault(); pick(cShown[cIdx]); }
  else if(e.key === 'Escape'){ closeList(); }
});

/* ── צילומי דרכון: דחיסה בדפדפן והמרה ל-base64 ───────── */
const drop = $('drop'), fileIn = $('passport'),
      fileList = $('fileList'), fileHint = $('fileHint');
let files = [];   // {name, mime, data, size}

const fmtKB = b => b < 1048576 ? Math.round(b/1024) + ' KB'
                               : (b/1048576).toFixed(1) + ' MB';

function renderFiles(){
  fileList.innerHTML = '';
  files.forEach((f,i) => {
    const el = document.createElement('div');
    el.className = 'file';
    el.innerHTML =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" '
      + 'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
      + '<rect x="3" y="3" width="18" height="18" rx="2.5"></rect>'
      + '<circle cx="8.8" cy="9" r="1.6"></circle>'
      + '<path d="m21 16-5.2-5.2L5 21"></path></svg>'
      + '<span class="nm"></span><span class="sz"></span>'
      + '<button type="button" class="rm" aria-label="הסר קובץ">×</button>';
    el.querySelector('.nm').textContent = f.name;
    el.querySelector('.sz').textContent = fmtKB(f.size);
    el.querySelector('.rm').onclick = () => { files.splice(i,1); renderFiles(); };
    fileList.appendChild(el);
  });
  const total = files.reduce((s,f) => s + f.size, 0);
  fileHint.className = 'hint ok';
  fileHint.textContent = files.length
    ? files.length + ' קבצים · ' + fmtKB(total) + ' סה״כ'
    : '';
}

/* מקטין תמונות ל-1600px רוחב מקסימלי לפני השליחה */
function shrink(file){
  return new Promise(resolve => {
    if(file.type === 'application/pdf' || !file.type.startsWith('image/'))
      return toB64(file).then(resolve);
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const d = c.toDataURL('image/jpeg', 0.82).split(',')[1];
      resolve({
        name: file.name.replace(/\.[^.]+$/,'') + '.jpg',
        mime: 'image/jpeg', data: d,
        size: Math.round(d.length * 0.75)
      });
    };
    img.onerror = () => { URL.revokeObjectURL(url); toB64(file).then(resolve); };
    img.src = url;
  });
}

function toB64(file){
  return new Promise(res => {
    const r = new FileReader();
    r.onload = () => res({
      name: file.name, mime: file.type || 'application/octet-stream',
      data: r.result.split(',')[1], size: file.size
    });
    r.readAsDataURL(file);
  });
}

const MAX_FILES = 4, MAX_TOTAL = 9 * 1024 * 1024;

const dropTxt  = drop.querySelector('.drop-txt');
const dropIcon = drop.querySelector('svg');

function dropBusy(on, n){
  drop.classList.toggle('busy', on);
  dropIcon.style.display = on ? 'none' : '';
  if(on && !drop.querySelector('.spin')){
    const s = document.createElement('div'); s.className = 'spin';
    drop.insertBefore(s, dropTxt);
  }
  if(!on){ const s = drop.querySelector('.spin'); if(s) s.remove(); }
  dropTxt.textContent = on
    ? 'מעבד ' + n + (n === 1 ? ' קובץ...' : ' קבצים...')
    : 'בחר/י קובץ או גרור/י לכאן';
}

async function addFiles(list){
  fileHint.className = 'hint ok';
  fileHint.textContent = '';
  dropBusy(true, list.length);
  let warn = '';
  for(const f of list){
    if(files.length >= MAX_FILES){
      warn = 'ניתן לצרף עד ' + MAX_FILES + ' קבצים'; break;
    }
    if(f.size > 20 * 1024 * 1024){
      warn = f.name + ' — הקובץ גדול מדי (מעל 20MB)'; continue;
    }
    const out = await shrink(f);
    const total = files.reduce((s,x) => s + x.size, 0) + out.size;
    if(total > MAX_TOTAL){
      warn = 'הגעת למגבלת הגודל — הסר/י קובץ כדי להוסיף עוד'; break;
    }
    files.push(out);
  }
  dropBusy(false);
  renderFiles();
  if(warn){ fileHint.className = 'hint bad'; fileHint.textContent = warn; }
  fileIn.value = '';
}

fileIn.addEventListener('change', e => addFiles([...e.target.files]));
['dragenter','dragover'].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => addFiles([...e.dataTransfer.files]));

const errTxt = $('formErrTxt'), mailFb = $('mailFb');

function fail(msg, field, fallback){
  errTxt.textContent = msg;
  errBox.classList.add('show');
  mailFb.classList.toggle('show', !!fallback);
  if(field){ field.classList.add('err'); field.focus(); }
  errBox.scrollIntoView({block:'center', behavior:'smooth'});
  return false;
}

/* גיבוי: פותח מייל מוכן למחלקה עם כל פרטי הפנייה */
let lastPayload = null;
function openMail(){
  const d = lastPayload; if(!d) return;
  const subject = (d.urgency === 'דחוף' ? 'פנייה דחופה — ' : 'פנייה — ויזה — ')
                + d.destination + ' — יציאה ' + d.departure;
  const body = [
    'לקוח: '   + d.client_name,
    'טלפון: '  + d.client_phone,
    'דוא״ל: '  + (d.client_email || '—'),
    'איפון חברה: ' + (d.company || '—'),
    'יעד: '    + d.destination,
    'נוסעים: ' + d.pax,
    'יציאה: '  + d.departure + ' (בעוד ' + d.days_left + ' ימים)',
    'דחיפות: ' + d.urgency,
    'הערות: '  + (d.notes || '—'),
    '',
    'מפנה: ' + d.agent_name,
    files.length ? '(יש לצרף ידנית ' + files.length + ' צילומי דרכון)' : ''
  ].join('\n');
  window.location.href = 'mailto:' + VISA_EMAIL
    + '?subject=' + encodeURIComponent(subject)
    + '&body='    + encodeURIComponent(body);
}
mailFb.addEventListener('click', openMail);

function validate(){
  /* מלכודת בוטים: שדה מוסתר שרק סקריפט אוטומטי ימלא */
  if($('website').value){ return false; }

  errBox.classList.remove('show');
  form.querySelectorAll('.err').forEach(el => el.classList.remove('err'));
  const req = [
    ['agent_name','חסר שם המפנה'],
    ['client_name','חסר שם הלקוח'],
    ['client_phone','חסר טלפון של הלקוח'],
    ['destination','לא נבחר יעד'],
    ['departure','חסר תאריך יציאה']
  ];
  for(const [id,msg] of req){
    if(!$(id).value.trim()) return fail(msg, $(id));
  }
  if(!validPhone(phone.value)) return fail('מספר הטלפון אינו תקין', phone);
  const em = $('client_email');
  if(em.value.trim() && !/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(em.value.trim()))
    return fail('כתובת הדוא״ל אינה תקינה', em);
  if(daysToDeparture() < 0) return fail('תאריך היציאה כבר עבר', dep);
  return true;
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  if(!validate()) return;

  const n = daysToDeparture();
  const payload = {
    agent_name  : $('agent_name').value.trim(),
    client_name : $('client_name').value.trim(),
    client_phone: cleanPhone(phone.value),
    client_email: $('client_email').value.trim(),
    company     : $('company').value.trim(),
    destination : $('destination').value.trim(),
    pax         : $('pax').value,
    departure   : dep.value,
    days_left   : n,
    urgency     : n <= URGENT_DAYS ? 'דחוף' : 'רגיל',
    files       : files,
    notes       : $('notes').value.trim(),
    department  : 'visas',
    source      : 'call_center',
    fill_ms     : Date.now() - PAGE_READY,   // זמן מילוי, לזיהוי בוטים בשרת
    hp          : $('website').value,
    submitted_at: new Date().toISOString()
  };

  lastPayload = payload;
  btn.disabled = true;
  btnTxt.textContent = 'שולח...';

  if(!ENDPOINT){
    btn.disabled = false;
    btnTxt.textContent = 'שלח למחלקת ויזות';
    return fail('הטופס לא מחובר לשרת — יש להגדיר ENDPOINT בקוד.', null, true);
  }

  try{
    const res = await fetch(ENDPOINT, {
      method : 'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},  // מונע preflight מול Apps Script
      body   : JSON.stringify(payload)
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    let data = {};
    try{ data = await res.json(); }catch(_){}
    if(data.status && data.status !== 'ok') throw new Error(data.message || 'server');

    rememberSet(payload.agent_name);
    form.style.display = 'none';
    $('done').classList.add('show');
    $('doneMsg').textContent = payload.urgency === 'דחוף'
      ? 'הפנייה סומנה כדחופה. נציג המחלקה יחזור ללקוח בהקדם.'
      : 'מחלקת הויזות קיבלה את הפרטים ותחזור ללקוח בהקדם.';
    $('refNo').textContent = data.ref ? 'אסמכתה ' + data.ref : '';
    $('refNo').style.display = data.ref ? '' : 'none';
    $('done').scrollIntoView({block:'start', behavior:'smooth'});
  }catch(err){
    btn.disabled = false;
    btnTxt.textContent = 'שלח למחלקת ויזות';
    fail('השליחה נכשלה. נסה/י שוב, או שלח/י את הפנייה במייל:', null, true);
    console.error(err);
  }
});

/* פנייה נוספת — משאיר את פרטי המפנה */
$('againBtn').addEventListener('click', () => {
  const name = $('agent_name').value || rememberGet();
  form.reset();
  $('agent_name').value = name;
  $('pax').value = 1;
  files = []; renderFiles();
  setFlag('');
  depHint.textContent = ''; phoneHint.textContent = ''; fileHint.textContent = '';
  form.classList.add('noanim');   // אנימציית הכניסה רצה רק בטעינה הראשונה
  $('done').classList.remove('show');
  errBox.classList.remove('show'); mailFb.classList.remove('show');
  lastPayload = null;
  form.style.display = '';
  btn.disabled = false; btnTxt.textContent = 'שלח למחלקת ויזות';
  $('client_name').focus();
});
</script>

<!--
════════════════════════════════════════════════════════════
 קוד Google Apps Script — שולח כל פנייה למייל מחלקת הויזות
 ומתעד אותו בגיליון (הגיליון אופציונלי).

 התקנה:
 1. script.google.com › New project › הדבק את הקוד למטה
 2. Deploy › New deployment › Web app
    Execute as: Me   |   Who has access: Anyone
 3. הרשאה ראשונה תבקש אישור לשליחת מייל — אשר
 4. את כתובת ה-exec הדבק ב-const ENDPOINT בראש הסקריפט למעלה

var VISA_EMAIL = 'visa.dept@amsalem.com';
var SHEET_ID   = '';   // אופציונלי: מזהה גיליון לתיעוד. השאר ריק לשליחת מייל בלבד.
var SHEET_NAME = 'פניות';

function doPost(e){
  try{
    var d   = JSON.parse(e.postData.contents);
    var ref = nextRef_();
    var urgent = d.urgency === 'דחוף';

    var atts = (d.files || []).map(function(f){
      return Utilities.newBlob(Utilities.base64Decode(f.data), f.mime, f.name);
    });

    MailApp.sendEmail({
      to         : VISA_EMAIL,
      subject    : (urgent ? '🔴 פנייה דחופה — ' : 'פנייה — ויזה — ')
                 + d.destination + ' — יציאה ' + d.departure
                 + ' — ' + d.client_name,
      htmlBody   : buildHtml_(d, ref, urgent),
      attachments: atts,
      name       : 'טופס פניות AMSVISA'
    });

    logToSheet_(d, ref);

    return json_({status:'ok', ref:ref});
  }catch(err){
    return json_({status:'error', message:String(err)});
  }
}

/* מספר אסמכתה רץ: V + תאריך + מונה יומי */
function nextRef_(){
  var p    = PropertiesService.getScriptProperties();
  var day  = Utilities.formatDate(new Date(),'Asia/Jerusalem','yyMMdd');
  var n    = (p.getProperty('day') === day ? Number(p.getProperty('n')) : 0) + 1;
  p.setProperties({day:day, n:String(n)});
  return 'V' + day + '-' + n;
}

function buildHtml_(d, ref, urgent){
  function row(k,v){
    return '<tr><td style="padding:7px 12px;background:#f5f8fa;font-weight:700;'
         + 'white-space:nowrap">' + k + '</td>'
         + '<td style="padding:7px 12px">' + (v || '—') + '</td></tr>';
  }
  return '<div dir="rtl" style="font-family:Arial,sans-serif;color:#2b3338;max-width:560px">'
    + '<div style="background:' + (urgent ? '#e07b39' : '#1bb0ce')
    + ';color:#fff;padding:14px 18px;border-radius:8px 8px 0 0;font-size:17px;font-weight:bold">'
    + (urgent ? 'פנייה דחופה — יציאה בעוד ' + d.days_left + ' ימים' : 'פנייה חדשה — ויזה')
    + '</div>'
    + '<table style="width:100%;border-collapse:collapse;border:1px solid #dfe6ea;font-size:14px">'
    + row('אסמכתה', ref)
    + row('לקוח', d.client_name)
    + row('איפון חברה', d.company)
    + row('טלפון', '<a href="tel:' + d.client_phone + '">' + d.client_phone + '</a>')
    + row('דוא״ל', d.client_email ? '<a href="mailto:' + d.client_email + '">' + d.client_email + '</a>' : '')
    + row('יעד', d.destination)
    + row('נוסעים', d.pax)
    + row('תאריך יציאה', d.departure + ' (בעוד ' + d.days_left + ' ימים)')
    + row('צילומי דרכון', (d.files && d.files.length)
          ? d.files.length + ' קבצים מצורפים למייל' : 'לא צורפו')
    + row('הערות', d.notes)
    + row('מפנה', d.agent_name)
    + '</table></div>';
}

function logToSheet_(d, ref){
  if(!SHEET_ID) return;
  try{
    var sh = SpreadsheetApp.openById(SHEET_ID).getSheetByName(SHEET_NAME);
    if(!sh) return;
    sh.appendRow([
      new Date(), ref, d.agent_name, d.company, d.client_name,
      "'" + d.client_phone, d.client_email, d.destination, d.pax,
      d.departure, d.days_left, d.urgency,
      (d.files || []).length, d.notes, d.source
    ]);
  }catch(err){ /* כישלון תיעוד לא מפיל את שליחת המייל */ }
}

function json_(o){
  return ContentService.createTextOutput(JSON.stringify(o))
         .setMimeType(ContentService.MimeType.JSON);
}

 שורת כותרות מומלצת בגיליון "פניות":

 יעד | נוסעים | תאריך יציאה | ימים ליציאה | דחיפות | צילומים | הערות | מקור
